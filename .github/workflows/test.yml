name: Test

on: [push]

env:
  CIF_VERSION: "2026-09-12"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
    - uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies [Ubuntu]
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz gcc-multilib

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install --upgrade pytest
        python -m pip install -e .

    - name: Install CIF
      if: "!startsWith(matrix.os, 'windows')"
      run: |
        os=$(uname -s | tr A-Z a-z | sed s/darwin/macos/)
        arch=$(uname -m)
        curl -sSfL -o cif.tar.xz "https://github.com/17451k/cif/releases/download/$CIF_VERSION/$os-$arch-cif-$CIF_VERSION.tar.xz"
        tar xf cif.tar.xz
        # Expose only cif: cif/bin/gcc is Aspectator and must not shadow the system compiler
        mkdir cifpath && ln -s "$GITHUB_WORKSPACE/cif/bin/cif" cifpath/cif

    - name: Test with pytest
      if: "!startsWith(matrix.os, 'windows')"
      run: |
        PATH=$GITHUB_WORKSPACE/cifpath:$PATH pytest

    - name: Test with pytest [windows]
      if: startsWith(matrix.os, 'windows')
      run: |
        pytest .\tests\test_windows.py
